html,body{max-width:100%;overflow-x:clip}

 .layout>aside.panel{padding:12px}

 .cx-metric span{font-size:10px}
 .cx-metric small{font-size:9px}
 .cx-course{gap:10px;padding:9px}
 .cx-course .cx-art{width:34%;min-width:88px}
 .cx-art span{font-size:54px}
 .cx-course h3{font-size:15px}
 .cx-section-head h2{font-size:18px}
 .cx-progress-flex{gap:12px}
 .cx-ring{width:108px;height:108px;flex-basis:108px}

 .cx-legend p{font-size:11px;white-space:normal}

a1:{duration:'15–25 minutes',objective:'Understand the workflow before opening any software.',sections:[
['The business opportunity','You are learning to build a customer follow-up system that can be adapted for dental offices, contractors, auto repair shops, and other service businesses. A customer sends an inquiry; the business receives it immediately; the customer gets an acknowledgment; and the team tracks whether the inquiry becomes an appointment or quote.'],
['The core concept: Trigger → Action → Result','TRIGGER: A customer submits an inquiry. ACTION: Record the inquiry, notify the business, and prepare or send an appropriate acknowledgment. RESULT: The inquiry is visible, assigned, and ready for follow-up. Every automation you build should have a clearly defined trigger, action, and measurable result.'],
['Map the complete workflow','1. Customer submits a website form (later, email or text can be added). 2. Google Forms records the inquiry in Google Sheets. 3. Apps Script runs when the response arrives. 4. The script marks urgent inquiries and emails the business. 5. The business contacts the customer, books an appointment, or prepares a quote. 6. The business records status and results.'],
['What you will build during this course','A working Google Form, linked response spreadsheet, Apps Script notification automation, urgency classification, customer acknowledgment safeguards, and a basic tracking process. Begin with test inquiries using your own email; do not use real customer data during practice.'],
['Your 30-day roadmap','WEEK 1 — Understand triggers, actions, AI, databases, and business workflows. WEEK 2 — Build the form, tracker, automated notifications, and follow-up reminders. WEEK 3 — Test failures, duplicate messages, permissions, privacy, and reporting. WEEK 4 — Prepare a demonstration, quote a pilot, set up a client safely, and measure results.'],
['What could you charge?','Illustrative pricing to test, not guaranteed market rates: basic inquiry automation $300–$750 setup; appointment follow-up $500–$1,500 setup; advanced workflows $1,500–$5,000+ setup; monitoring/support $100–$500 per month. Price depends on complexity, reliability, operating costs, and customer value.'],
['Exercise — write your first workflow','Choose a business type. Write one sentence for the trigger, one for the action, and one for the result. Then describe what the owner must do when a new inquiry arrives. Mark the guided practice steps below only after you have done the exercise.']]},
a2:{duration:'45–75 minutes',objective:'Build a working customer inquiry tracker and owner notification using Google Forms, Sheets and Apps Script.',sections:[
['Step 1 — Create the Google Form','Open Google Forms using the button below. Choose Blank form. Set the title to “Customer Inquiry & Follow-Up”. Add these questions in order: Customer Name (Short answer, required); Email Address (Short answer, required); Phone Number (Short answer, optional); Service Requested (Dropdown, required; include General Inquiry, Request a Quote, Appointment, Urgent Assistance); Message (Paragraph, required).'],
['Step 2 — Fix the email field correctly','Click the Email Address question. Set the question type to Short answer — NOT Number. Use the three-dot menu → Response validation → Text → Email address if that option is available in your Forms interface. Enter a test email such as student@example.com and confirm it is accepted. A number-only validation rule will reject email addresses.'],
['Step 3 — Link the Form to a spreadsheet','In Google Forms, open Responses. Select Link to Sheets (green Sheets icon), create a new spreadsheet, and open it. Confirm a response tab such as “Form Responses 1” exists. Submit a test inquiry from the published/live form, then verify that Customer Name, Email Address, Phone Number, Service Requested, and Message appear in the response row.'],
['Step 4 — Open the automation editor','From the linked Google Sheet, choose Extensions → Apps Script. Rename the project “Customer Inquiry Follow-Up Automation”. Replace the starter function with the complete example script shown below. Change the owner email setting to an inbox you control. Save the script.'],
['Step 5 — Understand the script before running it','The function onInquirySubmitted receives the spreadsheet form-submit event. It reads the submitted row, normalizes question names to handle spaces and capitalization, identifies Urgent Assistance, writes the status into an Inquiry Status column, and sends the business owner an email. It does NOT automatically email the customer; that comes in Lesson 3.'],

a3:{duration:'45–60 minutes',objective:'Add a safe customer acknowledgment and a practical follow-up process.',sections:[
['Step 1 — Plan the acknowledgment','A good acknowledgment confirms receipt, sets expectations, and does not promise an appointment. Example: “Thank you for contacting us. We received your inquiry and a team member will review it. For urgent needs, please call our office directly.” Replace generic wording with the business’s approved contact information.'],
['Step 2 — Protect customer data','Before sending to customers, verify that the Email Address field is a real email address, avoid including sensitive personal details in email, and use only test addresses you control. For dental offices, do not put patient health information in an ordinary inquiry form or email workflow without an appropriately secured, compliant system.'],
['Step 3 — Add the acknowledgment safely','Open your Apps Script from Lesson 2. Find the optional acknowledgment function shown in the example below. For practice, leave CUSTOMER_EMAIL_ENABLED set to false until you have tested owner notifications. Set it to true only when your test workflow and recipient controls are correct.'],
['Step 4 — Prevent duplicate messages','Each form submission gets a row. The script checks the Acknowledgment Sent column before emailing. If that row is already marked SENT, it does not send again. This prevents many accidental duplicates if the same event is retried; it does not replace production-grade idempotency controls.'],

const automationCode=String.raw`// AITS Academy — practice example. Replace with an inbox YOU control.
const OWNER_EMAIL = 'replace-with-your-email@example.com';
const CUSTOMER_EMAIL_ENABLED = false; // Keep false until owner tests pass.

function onInquirySubmitted(e) {
  if (!e || !e.range || !e.namedValues) {
    throw new Error('Submit the LIVE Google Form to test this function.');
  }
  if (OWNER_EMAIL.includes('replace-with-your-email')) {
    throw new Error('Set OWNER_EMAIL to your own email address first.');
  }
  const sheet = e.range.getSheet();
  const row = e.range.getRow();
  const values = {};
  Object.keys(e.namedValues).forEach(function(key) {
    values[key.trim().toLowerCase()] = String(e.namedValues[key][0] || '').trim();
  });
  const name = values['customer name'] || 'Customer';
  const email = values['email address'] || '';
  const phone = values['phone number'] || '';
  const service = values['service requested'] || 'General Inquiry';
  const message = values['message'] || '';
  const urgent = service.toLowerCase().includes('urgent');
  const statusCol = ensureColumn(sheet, 'Inquiry Status');
  const sentCol = ensureColumn(sheet, 'Acknowledgment Sent');
  sheet.getRange(row, statusCol).setValue(urgent ? 'URGENT' : 'NEW');

  MailApp.sendEmail({
    to: OWNER_EMAIL,
    subject: (urgent ? '[URGENT] ' : '[NEW] ') + 'Customer inquiry: ' + service,
    body: 'Name: ' + name + '\nEmail: ' + email +
          '\nPhone: ' + phone + '\nService: ' + service +
          '\nMessage: ' + message + '\nRow: ' + row
  });

  if (CUSTOMER_EMAIL_ENABLED &&
      /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) &&
      sheet.getRange(row, sentCol).getValue() !== 'SENT') {
    MailApp.sendEmail({
      to: email,
      subject: 'We received your inquiry',
      body: 'Hello ' + name + ',\n\nThank you for contacting us. ' +
            'We received your inquiry and will review it. ' +
            'For urgent needs, please call our office directly.\n\nThank you.'
    });
    sheet.getRange(row, sentCol).setValue('SENT');
  }
}

function ensureColumn(sheet, title) {
  const last = Math.max(sheet.getLastColumn(), 1);
  const headings = sheet.getRange(1, 1, 1, last).getValues()[0];
  const existing = headings.findIndex(function(h) {
    return String(h).trim().toLowerCase() === title.toLowerCase();
  });
  if (existing !== -1) return existing + 1;
  const col = last + 1;
  sheet.getRange(1, col).setValue(title);
  return col;
}`;

function guidePosition(id){const n=extendedGuides[id]?.sections.length||0;return Math.min(Math.max(0,Number(data.stepPosition?.[id]||0)),n)}
