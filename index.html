:#fff;border:1px solid #e9eafa;box-shadow:0 4px 15px #343f8910}.metric .number{font-size:30px;font-weight:850;margin:8px 0 3px}.metric .muted{font-size:13px}.section-title{font-size:20px;font-weight:850;margin:25px 0 12px}.course-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.course-tile{border:1px solid #e7e8fa;border-radius:19px;padding:20px;background:#fff;box-shadow:0 6px 20px #343f8910;display:flex;flex-direction:column;gap:10px}.course-icon{font-size:29px;width:60px;height:60px;border-radius:18px;display:grid;place-items:center}.course-tile h3{margin:0;font-size:18px}.course-tile p{margin:0;color:#61738e;font-size:14px;flex:1}.course-tile button{align-self:start}.track-chip{font-size:12px;font-weight:800;color:#5c45c4}.activity{padding:16px 20px;border-radius:17px;background:#fff;border:1px solid #e7e8fa}.activity p{margin:6px 0;color:#61738e}.quick-actions{display:flex;gap:9px;flex-wrap:wrap}.quick-actions .btn{font-size:13px}.panel h2{letter-spacing:-.4px}@media(max-width:750px){main{margin-top:12px}.layout{grid-template-columns:1fr}.dash-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.metric{padding:12px}.metric .number{font-size:23px}.course-grid{grid-template-columns:1fr}.hero{padding:20px}.hero .spark{font-size:46px}nav{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){.dash-grid{grid-template-columns:1fr 1fr}.dash-grid .metric:last-child{grid-column:span 2}}
</style></head><body><header><h1>✦ AITS Academy</h1><p>Learn by doing · Practical business technology · Independent, free learning app</p><button class="btn" id="shareAcademy" onclick="copyAcademyLink()" style="background:#fff;color:#183c88">🔗 Copy clean academy link</button> <span id="shareStatus" role="status" style="color:#fff;font-weight:650"></span></header><main><div class="layout"><aside class="panel"><h2>🚀 Explore AITS</h2><nav id="nav"></nav><hr><p class="muted">Your progress is saved in this browser. Export a backup regularly, especially before changing devices.</p><button class="btn alt" onclick="exportData()">⬇ Export progress</button><button class="btn alt" onclick="document.getElementById('importFile').click()">⬆ Import progress</button><input hidden type="file" id="importFile" accept=".json,application/json" onchange="importData(this)"></aside><section class="panel"><div id="content"></div></section></div></main><footer>AITS Academy · Installable web edition · No paid services required</footer><script>
const tracks=[{id:'automation',icon:'⚡',name:'AI Automation',intro:'Connect tools and automate real business tasks.'},{id:'agents',icon:'🤖',name:'AI Agents',intro:'Design assistants that plan and use tools responsibly.'},{id:'web',icon:'🌐',name:'Websites & Apps',intro:'Build, test and publish practical software.'},{id:'security',icon:'🛡️',name:'Cybersecurity',intro:'Protect accounts, data and systems.'}];
const lessons=[
{id:'a1',track:'automation',title:'Lesson 1 — Automation fundamentals',goal:'Identify triggers, actions, data and safeguards.',steps:['Define a repetitive business task that wastes time.','Identify its trigger: what event starts the process?','List the data required and the action to take.','Add an error-handling and human-review step.'],q:'What starts an automation?',options:['A trigger','A logo','A spreadsheet color'],answer:0,why:'A trigger is the event that initiates the workflow.'},
{id:'a2',track:'automation',title:'Lesson 2 — Customer Inquiry & Follow-Up Automation',goal:'Understand and verify your Google Forms → Sheets → Apps Script → Gmail workflow.',steps:['Open your Google Form and verify the customer email field uses Text → Email address validation.','Submit a realistic test inquiry, including a service requested and message.','Open Form Responses 1 in Google Sheets and verify every field was recorded.','Check the Apps Script trigger is installed for form submission.','Review the script: normalize e.namedValues keys with trim().toLowerCase() so field names with extra spaces are handled.','Verify the script classifies urgent requests as URGENT and sends a complete notification email.','Submit a second test with a normal request and verify the status and notification.','Document what should happen if an email address is missing or sending fails.'],q:'Why normalize form question names in Apps Script?',options:['To change the font','To avoid mismatches caused by spacing and capitalization','To delete duplicate customers'],answer:1,why:'Normalizing keys avoids failed lookups when a form field contains extra spaces or different capitalization.'},
{id:'a3',track:'automation',title:'Lesson 3 — Automatic customer acknowledgment',goal:'Plan a safe confirmation email and follow-up tracking process.',steps:['Write a short acknowledgment confirming the inquiry was received.','Ensure the email is sent only when a valid customer address is provided.','Add a status field such as New, Acknowledged, Follow-up Due, Resolved.','Test with your own address before enabling customer-facing messages.','Avoid sending duplicate acknowledgments for the same submission.','Check sending limits and keep a manual recovery process.'],q:'What should you do before sending automated emails to real customers?',options:['Test with your own address','Disable all logs','Send ten duplicate messages'],answer:0,why:'A controlled test prevents accidental or incorrect customer communications.'},

{id:'w1',track:'web',title:'Lesson 1 — Build a functional web page',goal:'Learn how HTML, CSS and JavaScript work together.',steps:['Use HTML to structure a heading, button and content area.','Use CSS to style colors, spacing and mobile layouts.','Use JavaScript to respond when the button is clicked.','Test on a phone-sized screen.','Save a copy and document your changes.'],q:'Which language makes a web button interactive?',options:['CSS','JavaScript','HTML comments'],answer:1,why:'JavaScript handles behavior such as clicks and state changes.'},

const KEY='academy-progress-v2';let data={done:{},quiz:{},notes:{},links:{}};try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');data={done:saved.done||{},quiz:saved.quiz||{},notes:saved.notes||{},links:saved.links||{}}}catch{}let active='dashboard',opened=null;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(data))}function count(l){return l.steps.filter((_,i)=>data.done[l.id+':'+i]).length}function percent(l){return Math.round(count(l)/l.steps.length*100)}function diagram(){return '<svg viewBox="0 0 700 130" role="img" aria-label="Form submission flows into a spreadsheet, then script, then email"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1686ac" stroke-width="2"/></marker></defs>'+['📝 Form','📊 Sheet','⚙️ Script','✉️ Email'].map((x,i)=>'<rect x="'+(i*178+4)+'" y="22" width="150" height="76" rx="14" fill="'+(i%2?'#e4f6f0':'#e8f1ff')+'" stroke="#b7d5e8"/><text x="'+(i*178+79)+'" y="65" text-anchor="middle" font-size="20" fill="#153b66">'+x+'</text>'+(i<3?'<path d="M'+(i*178+156)+' 60h20" stroke="#1686ac" stroke-width="3" marker-end="url(#arr)"/>':'' )).join('')+'</svg>'}function googleTools(id){if(!['a2','a3'].includes(id))return '';const links=[['📝 Google Forms','https://forms.google.com'],['📊 Google Sheets','https://sheets.google.com'],['⚙️ Apps Script','https://script.google.com/home'],['✉️ Gmail','https://mail.google.com']];return '<div class="card"><h4>🔗 One-click Google tools</h4><p class="muted">These open in a new tab using your existing Google login, or ask you to sign in. Never enter your Google password into AITS Academy.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px">'+links.map(([name,url])=>'<a class="btn alt" style="text-decoration:none;text-align:center" href="'+url+'" target="_blank" rel="noopener noreferrer">'+name+' ↗</a>').join('')+'</div><h4>📌 My project links</h4><p class="muted">Save your own Google Form, Sheet, and Script links for this lesson. Saved on this device until cloud accounts are enabled.</p>'+[['form','Form'],['sheet','Sheet'],['script','Script']].map(([k,label])=>'<label style="display:block;margin:9px 0">'+label+' URL <input style="width:100%;padding:10px;border:1px solid #b9cde5;border-radius:9px" type="url" placeholder="https://docs.google.com/..." value="'+esc((data.links&&data.links[id]&&data.links[id][k])||'')+'" onchange="saveProjectLink(this,\''+id+'\',\''+k+'\')"></label>').join('')+'</div>'}function saveProjectLink(el,id,k){const v=el.value.trim();if(v){let u;try{u=new URL(v)}catch{alert('Enter a valid https:// URL');return}if(u.protocol!=='https:'||!['docs.google.com','script.google.com'].includes(u.hostname)){alert('Only secure Google Forms, Sheets or Apps Script URLs are allowed');return}}data.links=data.links||{};data.links[id]=data.links[id]||{};data.links[id][k]=v;save()}function dashboard(){const finished=lessons.filter(l=>percent(l)===100).length,stepsDone=lessons.reduce((n,l)=>n+count(l),0),totalSteps=lessons.reduce((n,l)=>n+l.steps.length,0),answered=lessons.filter(l=>data.quiz[l.id]!==undefined).length;const latest=lessons.find(l=>count(l)>0&&percent(l)<100)||lessons.find(l=>percent(l)<100)||lessons[0];const palette=[['#f1e9ff','#6945d7'],['#e1f8f8','#119b9d'],['#fff0de','#e78a23'],['#e8f0ff','#3d76d9']];let out='<div class="hero"><div><span class="eyebrow">YOUR LEARNING ADVENTURE</span><h2>Discover. Build. Level up. ✨</h2><p>Explore practical AI and technology skills, complete hands-on challenges, and celebrate every milestone.</p><button class="btn" style="background:#fff;color:#4e37bf" onclick="jumpToLesson(\''+latest.id+'\')">▶ Continue learning</button></div><div class="spark" aria-hidden="true">🚀</div></div>';out+='<div class="dash-grid"><div class="metric"><span>📚 Lessons completed</span><div class="number" style="color:#6742d4">'+finished+' <small style="font-size:14px;color:#8390aa">/ '+lessons.length+'</small></div><div class="muted">Keep up the momentum</div></div><div class="metric"><span>⚡ Practice steps</span><div class="number" style="color:#119eab">'+stepsDone+' <small style="font-size:14px;color:#8390aa">/ '+totalSteps+'</small></div><div class="muted">Hands-on progress</div></div><div class="metric"><span>🏆 Quizzes attempted</span><div class="number" style="color:#ec9225">'+answered+'</div><div class="muted">Knowledge checks</div></div></div>';out+='<h2 class="section-title">🌈 Choose your learning path</h2><div class="course-grid">'+tracks.map((t,i)=>{const ls=lessons.filter(l=>l.track===t.id),done=ls.filter(l=>percent(l)===100).length,p=ls.length?Math.round(done/ls.length*100):0;return '<div class="course-tile"><div class="course-icon" style="background:'+palette[i][0]+';color:'+palette[i][1]+'">'+t.icon+'</div><span class="track-chip">'+ls.length+' LESSON'+(ls.length===1?'':'S')+'</span><h3>'+esc(t.name)+'</h3><p>'+esc(t.intro)+'</p><div class="progress"><div class="fill" style="width:'+p+'%"></div></div><span class="muted" style="font-size:12px">'+p+'% completed</span><button class="btn" onclick="choose(\''+t.id+'\')">Explore course →</button></div>'}).join('')+'</div>';out+='<h2 class="section-title">🎯 Your next move</h2><div class="activity"><strong>'+esc(latest.title)+'</strong><p>'+esc(latest.goal)+'</p><div class="quick-actions"><button class="btn" onclick="jumpToLesson(\''+latest.id+'\')">Open lesson</button><button class="btn alt" onclick="exportData()">⬇ Back up my progress</button></div></div>';out+='<p class="muted" style="font-size:13px;margin-top:16px">🔒 Progress currently saves on this device. Individual student accounts and cloud syncing are coming later.</p>';return out}function jumpToLesson(id){const l=lessons.find(x=>x.id===id);if(!l)return;active=l.track;opened=id;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){let nav='<button class="'+(active==='dashboard'?'active':'')+'" onclick="choose(\'dashboard\')">🏠 My Dashboard</button>'+tracks.map(t=>'<button class="'+(active===t.id?'active':'')+'" onclick="choose(\''+t.id+'\')">'+t.icon+' '+t.name+'</button>').join('');$('nav').innerHTML=nav;if(active==='dashboard'){$('content').innerHTML=dashboard();return}const t=tracks.find(x=>x.id===active),ls=lessons.filter(x=>x.track===active),finished=ls.filter(l=>percent(l)===100).length;let out='<span class="pill">'+t.icon+' '+esc(t.name)+'</span><h2>'+esc(t.name)+'</h2><p class="muted">'+esc(t.intro)+'</p><div class="progress"><div class="fill" style="width:'+(finished/ls.length*100)+'%"></div></div><p class="muted">'+finished+' of '+ls.length+' lessons practiced completely</p>';for(const l of ls){out+='<article class="card"><h3>📖 '+esc(l.title)+'</h3><p>'+esc(l.goal)+'</p><div class="progress"><div class="fill" style="width:'+percent(l)+'%"></div></div><p class="muted">'+count(l)+' / '+l.steps.length+' steps completed</p><button class="btn" onclick="openLesson(\''+l.id+'\')">'+(opened===l.id?'⬆ Hide':'▶ Open')+' lesson</button>';if(opened===l.id){out+=googleTools(l.id);if(l.id==='a2')out+='<h4>🔄 Workflow diagram</h4>'+diagram();out+='<h4>🧭 Guided practice</h4>'+l.steps.map((s,i)=>'<div class="step '+(data.done[l.id+':'+i]?'done':'')+'"><label><input type="checkbox" '+(data.done[l.id+':'+i]?'checked':'')+' onchange="toggle(\''+l.id+'\','+i+',this.checked)"> <strong>Step '+(i+1)+'</strong> — '+esc(s)+'</label></div>').join('');out+='<h4>🧠 Knowledge check</h4><p>'+esc(l.q)+'</p><div class="quiz">'+l.options.map((o,i)=>'<button class="'+(data.quiz[l.id]===i?(i===l.answer?'correct':'wrong'):'')+'" onclick="answer(\''+l.id+'\','+i+')">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('')+'</div>';if(data.quiz[l.id]!==undefined)out+='<p role="status"><strong>'+(data.quiz[l.id]===l.answer?'✓ Correct!':'Try again.')+'</strong> '+esc(l.why)+'</p>';out+='<h4>📝 My notes</h4><textarea aria-label="Notes for '+esc(l.title)+'" oninput="note(\''+l.id+'\',this.value)" placeholder="Record what you learned, issues, and next steps...">'+esc(data.notes[l.id]||'')+'</textarea><p class="muted">Notes save automatically in this browser.</p><button class="btn alt" onclick="resetLesson(\''+l.id+'\')">↻ Repeat lesson</button>'}out+='</article>'}$('content').innerHTML=out}function choose(id){active=id;opened=null;render()}function openLesson(id){opened=opened===id?null:id;render()}function toggle(id,i,v){data.done[id+':'+i]=v;save();render()}function answer(id,i){data.quiz[id]=i;save();render()}function note(id,v){data.notes[id]=v;save()}function resetLesson(id){if(!confirm('Reset steps and quiz for this lesson? Notes will remain.'))return;for(const k of Object.keys(data.done))if(k.startsWith(id+':'))delete data.done[k];delete data.quiz[id];save();render()}async function copyAcademyLink(){const url='https://aits-academy.onrender.com';try{await navigator.clipboard.writeText(url);$('shareStatus').textContent='✓ Clean link copied';}catch(e){const box=document.createElement('textarea');box.value=url;document.body.appendChild(box);box.select();const ok=document.execCommand('copy');box.remove();$('shareStatus').textContent=ok?'✓ Clean link copied':'Copy this address: '+url;}}function exportData(){const b=new Blob([JSON.stringify({version:2,...data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='academy-progress-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(el){const f=el.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x||typeof x!=='object'||typeof x.done!=='object'||typeof x.notes!=='object'||typeof x.quiz!=='object')throw Error('Invalid backup');if(!confirm('Replace current progress with this backup?'))return;data={done:x.done,notes:x.notes,quiz:x.quiz,links:x.links||{}};save();render();alert('Progress restored')}catch(e){alert('Could not import this backup: '+e.message)}el.value=''}render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script></body></html>
