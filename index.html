-width:1250px){.dash-main{grid-template-columns:1fr}.dash-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}@media(max-width:800px){header{padding:14px 18px;min-height:60px}header:before{display:none}.layout>aside.panel{width:auto}.layout>section.panel{margin:0;padding:16px}.course-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.course-grid,.dash-side{grid-template-columns:1fr}.course-tile{grid-template-columns:95px 1fr}.course-tile .course-icon{width:95px}.hero .spark{display:none}.certificate-row{align-items:flex-start;flex-direction:column}}</style></head><body><header><h1>✦ AITS Academy</h1><p>Learn by doing · Practical business technology · Independent, free learning app</p><button class="btn" id="shareAcademy" onclick="copyAcademyLink()" style="background:#fff;color:#183c88">🔗 Copy clean academy link</button> <span id="shareStatus" role="status" style="color:#fff;font-weight:650"></span></header><main><div class="layout"><aside class="panel"><h2>🎓 AITS Academy <span class="brand-tag">LEARNING PORTAL</span></h2><nav id="nav"></nav><hr><p class="muted">Your progress is saved in this browser. Export a backup regularly, especially before changing devices.</p><button class="btn alt" onclick="exportData()">⬇ Export progress</button><button class="btn alt" onclick="document.getElementById('importFile').click()">⬆ Import progress</button><input hidden type="file" id="importFile" accept=".json,application/json" onchange="importData(this)"></aside><section class="panel"><div id="content"></div></section></div></main><footer>AITS Academy · Installable web edition · No paid services required</footer><script>

const KEY='academy-progress-v2';let data={done:{},quiz:{},notes:{},links:{},studentName:'',certificates:{}};try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');data={done:saved.done||{},quiz:saved.quiz||{},notes:saved.notes||{},links:saved.links||{},studentName:saved.studentName||'',certificates:saved.certificates||{}}}catch{}let active='dashboard',opened=null;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(data))}function count(l){return l.steps.filter((_,i)=>data.done[l.id+':'+i]).length}function percent(l){return Math.round(count(l)/l.steps.length*100)}function diagram(){return '<svg viewBox="0 0 700 130" role="img" aria-label="Form submission flows into a spreadsheet, then script, then email"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1686ac" stroke-width="2"/></marker></defs>'+['📝 Form','📊 Sheet','⚙️ Script','✉️ Email'].map((x,i)=>'<rect x="'+(i*178+4)+'" y="22" width="150" height="76" rx="14" fill="'+(i%2?'#e4f6f0':'#e8f1ff')+'" stroke="#b7d5e8"/><text x="'+(i*178+79)+'" y="65" text-anchor="middle" font-size="20" fill="#153b66">'+x+'</text>'+(i<3?'<path d="M'+(i*178+156)+' 60h20" stroke="#1686ac" stroke-width="3" marker-end="url(#arr)"/>':'' )).join('')+'</svg>'}function googleTools(id){if(!['a2','a3'].includes(id))return '';const links=[['📝 Google Forms','https://forms.google.com'],['📊 Google Sheets','https://sheets.google.com'],['⚙️ Apps Script','https://script.google.com/home'],['✉️ Gmail','https://mail.google.com']];return '<div class="card"><h4>🔗 One-click Google tools</h4><p class="muted">These open in a new tab using your existing Google login, or ask you to sign in. Never enter your Google password into AITS Academy.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px">'+links.map(([name,url])=>'<a class="btn alt" style="text-decoration:none;text-align:center" href="'+url+'" target="_blank" rel="noopener noreferrer">'+name+' ↗</a>').join('')+'</div><h4>📌 My project links</h4><p class="muted">Save your own Google Form, Sheet, and Script links for this lesson. Saved on this device until cloud accounts are enabled.</p>'+[['form','Form'],['sheet','Sheet'],['script','Script']].map(([k,label])=>'<label style="display:block;margin:9px 0">'+label+' URL <input style="width:100%;padding:10px;border:1px solid #b9cde5;border-radius:9px" type="url" placeholder="https://docs.google.com/..." value="'+esc((data.links&&data.links[id]&&data.links[id][k])||'')+'" onchange="saveProjectLink(this,\''+id+'\',\''+k+'\')"></label>').join('')+'</div>'}function saveProjectLink(el,id,k){const v=el.value.trim();if(v){let u;try{u=new URL(v)}catch{alert('Enter a valid https:// URL');return}if(u.protocol!=='https:'||!['docs.google.com','script.google.com'].includes(u.hostname)){alert('Only secure Google Forms, Sheets or Apps Script URLs are allowed');return}}data.links=data.links||{};data.links[id]=data.links[id]||{};data.links[id][k]=v;save()}
function courseEligible(id){const ls=lessons.filter(l=>id==='master'||l.track===id);return ls.length>0&&ls.every(l=>l.steps.every((_,i)=>data.done[l.id+':'+i])&&data.quiz[l.id]===l.answer)}
function setStudentName(v){data.studentName=v.slice(0,100);save()}
function certificateId(id,date){let s=id+date+data.studentName.trim().toLowerCase(),h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return 'AITS-'+id.toUpperCase()+'-'+(h>>>0).toString(36).toUpperCase()}
function issueCertificate(id){if(!courseEligible(id))return alert('Complete all practice steps and correct quiz answers first.');if((data.studentName||'').trim().length<2)return alert('Enter your full name first.');if(!data.certificates)data.certificates={};if(!data.certificates[id]){const date=new Date().toISOString().slice(0,10);data.certificates[id]={date:date,name:data.studentName.trim(),number:certificateId(id,date)};save()}render()}
function printCertificate(id){const r=(data.certificates||{})[id];if(!r||!courseEligible(id))return alert('Certificate unavailable.');const title=id==='master'?'AI & Technology Skills — All Four Learning Paths':tracks.find(t=>t.id===id).name;const date=new Date(r.date+'T12:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});const w=window.open('','_blank');if(!w)return alert('Allow popups to print or save a certificate.');const doc=w.document;doc.title='AITS Academy Certificate';doc.body.style.cssText='font-family:Georgia,serif;text-align:center;color:#0b2850;padding:55px;border:12px double #143e72;min-height:70vh';const add=(tag,value)=>{const el=doc.createElement(tag);el.textContent=value;doc.body.appendChild(el)};add('h3','AITS ACADEMY — AI & Technology Skills');add('h1','Certificate of Successful Completion');add('p','This acknowledges that');add('h1',r.name);add('p','has completed all practice steps and knowledge checks for');add('h2',title);add('p','Date completed: '+date);add('p','Certificate reference: '+r.number);add('hr','');add('small','Device-based learning record. Identity and completion are not independently verified.');w.focus();w.print()}
function certificateSection(){const ids=tracks.map(t=>t.id).concat('master');let out='<div class="certificate-section" id="certificates"><h3>🎓 Certificates of Completion</h3><p class="muted">Complete every practice step and correctly answer each quiz to unlock a course certificate. Finish all four paths to unlock the master certificate. These are device-based, self-reported learning records, not independently verified credentials.</p><label for="studentFullName">Full name for certificates</label><input id="studentFullName" maxlength="100" style="display:block;width:100%;padding:12px;border:1px solid #b8cce4;border-radius:9px;margin:8px 0 15px" placeholder="Your full name" value="'+esc(data.studentName||'')+'" oninput="setStudentName(this.value)">';for(const id of ids){const title=id==='master'?'Master Certificate — All Four Paths':tracks.find(t=>t.id===id).name,r=(data.certificates||{})[id],ok=courseEligible(id);out+='<div class="certificate-row"><div><strong>'+esc(title)+'</strong><div class="muted">'+(r?'Recorded '+esc(r.date)+' · '+esc(r.number):ok?'Eligible for certificate':'Locked until all lessons and quizzes are completed')+'</div></div><button class="btn alt" '+(!ok?'disabled':'')+' onclick="'+(r?'printCertificate':'issueCertificate')+'(\''+id+'\')">'+(r?'Print / Save PDF':ok?'Issue certificate':'Locked')+'</button></div>'}return out+'</div>'}
function dashboard(){const finished=lessons.filter(l=>percent(l)===100).length,stepsDone=lessons.reduce((n,l)=>n+count(l),0),totalSteps=lessons.reduce((n,l)=>n+l.steps.length,0),answered=lessons.filter(l=>data.quiz[l.id]!==undefined).length,overall=totalSteps?Math.round(stepsDone/totalSteps*100):0;const latest=lessons.find(l=>count(l)>0&&percent(l)<100)||lessons.find(l=>percent(l)<100)||lessons[0];const palette=[['#e9e8ff','#5845c6'],['#dff9f7','#098f9e'],['#e9edff','#4d56c9'],['#e5fbf0','#168d67']];let out='<div class="dash-main"><div class="dash-primary"><div class="hero"><div><span class="eyebrow">AI & TECHNOLOGY SKILLS</span><h2>Welcome to<br>AITS Academy</h2><p>Build real-world skills in AI automation, web development, AI agents, and cybersecurity.</p><div class="quick-actions"><button class="btn" onclick="jumpToLesson(\''+latest.id+'\')">▶ Continue Learning</button><button class="btn" style="background:transparent;border:1px solid white" onclick="document.getElementById(\'course-catalog\').scrollIntoView({behavior:\'smooth\'})">▦ Browse Courses</button></div></div><div class="spark" aria-hidden="true">💻</div></div><div class="dash-grid"><div class="metric"><span>📘 Lessons completed</span><div class="number">'+finished+'</div><div class="muted">of '+lessons.length+' lessons</div></div><div class="metric"><span>◈ Practice steps</span><div class="number">'+stepsDone+'</div><div class="muted">of '+totalSteps+' steps</div></div><div class="metric"><span>🏆 Quizzes attempted</span><div class="number">'+answered+'</div><div class="muted">Knowledge checks</div></div><div class="metric"><span>📈 Overall progress</span><div class="number">'+overall+'%</div><div class="muted">Practice completion</div></div></div><h2 class="section-title" id="course-catalog">▱ Your Learning Paths</h2><div class="course-grid">'+tracks.map((t,i)=>{const ls=lessons.filter(l=>l.track===t.id),total=ls.reduce((n,l)=>n+l.steps.length,0),done=ls.reduce((n,l)=>n+count(l),0),p=total?Math.round(done/total*100):0;return '<div class="course-tile"><div class="course-icon" style="background:'+palette[i][0]+';color:'+palette[i][1]+'">'+t.icon+'</div><h3>'+esc(t.name)+'</h3><p>'+esc(t.intro)+'</p><strong style="font-size:12px">'+p+'% complete</strong><div class="progress"><div class="fill" style="width:'+p+'%"></div></div><button class="btn alt" onclick="choose(\''+t.id+'\')">Open course →</button></div>'}).join('')+'</div></div><aside class="dash-side"><div class="activity"><h3>📊 Your Progress</h3><div class="circle-progress" style="--pct:'+overall+'%"><span>'+overall+'%</span></div><p style="text-align:center">Overall practice progress</p><div class="muted">Completed '+finished+' of '+lessons.length+' lessons</div></div><div class="activity"><h3>▶ Continue Where You Left Off</h3><strong>'+esc(latest.title)+'</strong><p>'+esc(latest.goal)+'</p><div class="progress"><div class="fill" style="width:'+percent(latest)+'%"></div></div><button class="btn alt" onclick="jumpToLesson(\''+latest.id+'\')">Resume lesson →</button></div><div class="activity"><h3>🎯 Upcoming Goals</h3><div class="mini-goal">☐ Finish your next lesson</div><div class="mini-goal">☐ Complete a practice project</div><div class="mini-goal">☐ Take your next quiz</div><div class="mini-goal">☐ Reach 50% overall progress</div></div><div class="activity"><h3>🏅 Achievements</h3><p>'+(finished>0?'🏆 First lesson completed':'🔒 Complete your first lesson to earn a milestone')+'</p><p>'+(answered>0?'⚡ Quiz explorer':'🔒 Attempt a quiz to unlock Quiz Explorer')+'</p><p class="muted">Milestones are based on your saved activity.</p></div></aside></div><p class="muted" style="font-size:12px;margin-top:20px">Your progress is stored on this device until individual accounts and cloud synchronization are enabled.</p>';return out}function jumpToLesson(id){const l=lessons.find(x=>x.id===id);if(!l)return;active=l.track;opened=id;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){let nav='<button class="'+(active==='dashboard'?'active':'')+'" onclick="choose(\'dashboard\')">🏠 My Dashboard</button>'+tracks.map(t=>'<button class="'+(active===t.id?'active':'')+'" onclick="choose(\''+t.id+'\')">'+t.icon+' '+t.name+'</button>').join('');$('nav').innerHTML=nav;if(active==='dashboard'){$('content').innerHTML=dashboard();return}const t=tracks.find(x=>x.id===active),ls=lessons.filter(x=>x.track===active),finished=ls.filter(l=>percent(l)===100).length;let out='<span class="pill">'+t.icon+' '+esc(t.name)+'</span><h2>'+esc(t.name)+'</h2><p class="muted">'+esc(t.intro)+'</p><div class="progress"><div class="fill" style="width:'+(finished/ls.length*100)+'%"></div></div><p class="muted">'+finished+' of '+ls.length+' lessons practiced completely</p>';for(const l of ls){out+='<article class="card"><h3>📖 '+esc(l.title)+'</h3><p>'+esc(l.goal)+'</p><div class="progress"><div class="fill" style="width:'+percent(l)+'%"></div></div><p class="muted">'+count(l)+' / '+l.steps.length+' steps completed</p><button class="btn" onclick="openLesson(\''+l.id+'\')">'+(opened===l.id?'⬆ Hide':'▶ Open')+' lesson</button>';if(opened===l.id){out+=googleTools(l.id);if(l.id==='a2')out+='<h4>🔄 Workflow diagram</h4>'+diagram();out+='<h4>🧭 Guided practice</h4>'+l.steps.map((s,i)=>'<div class="step '+(data.done[l.id+':'+i]?'done':'')+'"><label><input type="checkbox" '+(data.done[l.id+':'+i]?'checked':'')+' onchange="toggle(\''+l.id+'\','+i+',this.checked)"> <strong>Step '+(i+1)+'</strong> — '+esc(s)+'</label></div>').join('');out+='<h4>🧠 Knowledge check</h4><p>'+esc(l.q)+'</p><div class="quiz">'+l.options.map((o,i)=>'<button class="'+(data.quiz[l.id]===i?(i===l.answer?'correct':'wrong'):'')+'" onclick="answer(\''+l.id+'\','+i+')">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('')+'</div>';if(data.quiz[l.id]!==undefined)out+='<p role="status"><strong>'+(data.quiz[l.id]===l.answer?'✓ Correct!':'Try again.')+'</strong> '+esc(l.why)+'</p>';out+='<h4>📝 My notes</h4><textarea aria-label="Notes for '+esc(l.title)+'" oninput="note(\''+l.id+'\',this.value)" placeholder="Record what you learned, issues, and next steps...">'+esc(data.notes[l.id]||'')+'</textarea><p class="muted">Notes save automatically in this browser.</p><button class="btn alt" onclick="resetLesson(\''+l.id+'\')">↻ Repeat lesson</button>'}out+='</article>'}$('content').innerHTML=out}function choose(id){active=id;opened=null;render()}function openLesson(id){opened=opened===id?null:id;render()}function toggle(id,i,v){data.done[id+':'+i]=v;save();render()}function answer(id,i){data.quiz[id]=i;save();render()}function note(id,v){data.notes[id]=v;save()}function resetLesson(id){if(!confirm('Reset steps and quiz for this lesson? Notes will remain.'))return;for(const k of Object.keys(data.done))if(k.startsWith(id+':'))delete data.done[k];delete data.quiz[id];save();render()}async function copyAcademyLink(){const url='https://aits-academy.onrender.com';try{await navigator.clipboard.writeText(url);$('shareStatus').textContent='✓ Clean link copied';}catch(e){const box=document.createElement('textarea');box.value=url;document.body.appendChild(box);box.select();const ok=document.execCommand('copy');box.remove();$('shareStatus').textContent=ok?'✓ Clean link copied':'Copy this address: '+url;}}function exportData(){const b=new Blob([JSON.stringify({version:2,...data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='academy-progress-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(el){const f=el.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x||typeof x!=='object'||typeof x.done!=='object'||typeof x.notes!=='object'||typeof x.quiz!=='object')throw Error('Invalid backup');if(!confirm('Replace current progress with this backup?'))return;data={done:x.done,notes:x.notes,quiz:x.quiz,links:x.links||{},studentName:x.studentName||'',certificates:x.certificates||{}};save();render();alert('Progress restored')}catch(e){alert('Could not import this backup: '+e.message)}el.value=''}render();
